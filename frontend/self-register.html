<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enroll — The Little Playhut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root {
    --forest-deep: #1B2E22;
    --sage-light: #E4EBDE;
    --meadow: #CFDCC3;
    --birch: #F4EDE0;
    --wood: #8B5E34;
    --gold: #D9A441;
    --gold-dark: #BF8A2E;
    --bark: #3A2E22;
    --moss: #6B7A5E;
    --white: #FFFFFF;
    --error: #B3462E;
    --error-bg: #FBEAE4;
    --success: #4A7A5C;
    --success-bg: #E7F1EA;
    --sand-line: rgba(139,94,52,0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, var(--sage-light) 0%, var(--meadow) 100%);
    color: var(--bark);
    min-height: 100vh;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: 'Fredoka', sans-serif; font-weight: 600; letter-spacing: -0.01em; }

  .wrap { max-width: 620px; margin: 0 auto; }

  .card {
    background: var(--birch); border: 1px solid var(--sand-line); border-radius: 20px;
    padding: 40px 36px; box-shadow: 0 24px 64px rgba(15,27,20,0.18), 0 2px 8px rgba(15,27,20,0.10);
  }

  .card img.mark { width: 84px; height: 84px; margin: 0 auto 16px; display: block; object-fit: contain; }
  .card h1 { font-size: 24px; text-align: center; color: var(--forest-deep); margin: 0 0 6px; }
  .sub { text-align: center; font-size: 14px; color: var(--moss); margin: 0 0 30px; }

  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--wood); margin: 26px 0 12px;
  }
  .section-title:first-of-type { margin-top: 0; }

  .child-block {
    background: #fff; border: 1px solid var(--sand-line); border-radius: 12px;
    padding: 18px 18px 6px; margin-bottom: 14px; position: relative;
  }
  .child-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .child-block-header strong { font-size: 13px; color: var(--wood); text-transform: uppercase; letter-spacing: 0.03em; }
  .remove-child-link { font-size: 12.5px; font-weight: 600; color: var(--error); cursor: pointer; background: none; border: none; padding: 0; }

  .field { margin-bottom: 16px; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--bark); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 12px 14px; border: 1.5px solid rgba(139,94,52,0.25); border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 15px; color: var(--bark); background: #FFFDF8;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--gold); background: #fff; }
  .field-hint { font-size: 12px; color: var(--moss); margin-top: 5px; }

  .signature-canvas {
    width: 100%; height: 160px; border: 1.5px dashed var(--wood); border-radius: 10px;
    background: #fff; cursor: crosshair; touch-action: none; display: block;
  }
  .clear-link {
    display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 600;
    color: var(--wood); cursor: pointer; background: none; border: none; padding: 0;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 20px; border-radius: 10px; border: none; font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--forest-deep); color: var(--birch); }
  .btn-primary:hover { background: #12241A; }
  .btn-primary:disabled { background: #B9BFB2; cursor: not-allowed; }

  .error-banner {
    display: none; background: var(--error-bg); color: var(--error); font-size: 13px; font-weight: 500;
    padding: 10px 14px; border-radius: 8px; margin-bottom: 18px;
  }
  .error-banner.visible { display: block; }

  .center-state { text-align: center; padding: 20px 0; }
  .center-state h2 { font-size: 20px; color: var(--forest-deep); margin: 14px 0 8px; }
  .center-state p { font-size: 14px; color: var(--moss); margin: 0 0 8px; }
  .success-icon {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: var(--success-bg); color: var(--success);
  }

  .credentials-box {
    background: #fff; border: 1px solid var(--sand-line); border-radius: 12px;
    padding: 20px 22px; margin: 20px 0; text-align: left;
  }
  .credentials-box img.qr { display: block; margin: 0 auto 16px; border-radius: 10px; border: 1px solid var(--sand-line); }
  .cred-row { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--sand-line); font-size: 14px; }
  .cred-row:last-child { border-bottom: none; }
  .cred-row .cred-label { color: var(--moss); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  .cred-row .cred-value { font-weight: 600; color: var(--bark); font-family: 'SF Mono', Consolas, monospace; }

  .save-warning {
    background: rgba(217,164,65,0.14); color: var(--gold-dark); border-radius: 8px;
    padding: 10px 14px; font-size: 12.5px; font-weight: 500; margin-top: 14px;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <img class="mark" src="https://res.cloudinary.com/dhlymdlu/image/upload/v1788058962/Screenshot_2026-08-04_at_8.42.07_PM.png" alt="The Little Playhut">
    <h1>Enroll at The Little Playhut</h1>
    <p class="sub">Fill this out, sign at the bottom, and you're enrolled — no appointment needed.</p>

    <div id="content">
      <div class="error-banner" id="form-error"></div>

      <form id="register-form">
        <div class="section-title">Parent / Guardian</div>
        <div class="field">
          <label for="parent-name">Full name</label>
          <input type="text" id="parent-name" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="parent-email">Email</label>
            <input type="email" id="parent-email" required>
          </div>
          <div class="field">
            <label for="parent-phone">Phone</label>
            <input type="text" id="parent-phone">
          </div>
        </div>
        <div class="field">
          <label for="mailing-address">Mailing address <span style="font-weight:400; color:#8A9490;">(optional)</span></label>
          <input type="text" id="mailing-address">
        </div>

        <div class="field-row">
          <div class="field">
            <label for="secondary-name">Secondary parent <span style="font-weight:400; color:#8A9490;">(optional)</span></label>
            <input type="text" id="secondary-name">
          </div>
          <div class="field">
            <label for="secondary-phone">Their phone</label>
            <input type="text" id="secondary-phone">
          </div>
        </div>

        <div class="section-title">Children</div>
        <div id="children-container"></div>
        <button type="button" class="clear-link" style="margin-bottom:20px;" onclick="addChildBlock()">+ Add another child</button>

        <div class="section-title">Payment</div>
        <div id="services-total-wrap" style="display:none; justify-content:space-between; align-items:center; background:#fff; border:1px solid var(--sand-line); border-radius:10px; padding:12px 16px; margin-bottom:16px;">
          <span style="font-size:13.5px; font-weight:600; color:var(--wood);">Services selected</span>
          <span id="services-total-amount" style="font-size:18px; font-weight:700; color:var(--forest-deep);"></span>
        </div>
        <p class="field-hint" style="margin:-10px 0 16px;">No charge happens today — this is what a future invoice will bill for.</p>
        <div class="field">
          <label>Card on file <span style="font-weight:400; color:#8A9490;">(required to complete enrollment — no charge today)</span></label>
          <div id="card-status-not-saved">
            <div id="stripe-card-element" style="padding:12px 14px; border:1.5px solid rgba(139,94,52,0.25); border-radius:10px; background:#FFFDF8;"></div>
            <button type="button" class="btn btn-primary" id="save-card-btn" style="background:var(--wood); margin-top:10px;" onclick="saveCard()">Save card</button>
          </div>
          <div id="card-status-saved" style="display:none; padding:12px 14px; background:var(--success-bg); color:var(--success); border-radius:10px; font-size:13.5px; font-weight:600;">
            ✓ Card saved
          </div>
          <div class="error-banner" id="card-error" style="margin-top:10px;"></div>
        </div>

        <div class="section-title">Signature</div>
        <div class="field">
          <label for="signer-name">Your full name (as signature)</label>
          <input type="text" id="signer-name" required>
        </div>
        <div class="field">
          <label>Sign below</label>
          <canvas id="sig-canvas" class="signature-canvas"></canvas>
          <button type="button" class="clear-link" onclick="clearSignature()">Clear</button>
        </div>

        <button type="button" class="btn btn-primary" id="submit-btn" onclick="submitRegistration()">Sign & complete enrollment</button>
      </form>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://little-playhut-backend.onrender.com';
  let signaturePad = null;
  let childBlockCount = 0; // used only to generate unique element IDs, not a real count

  function addChildBlock() {
    childBlockCount++;
    const id = childBlockCount;
    const container = document.getElementById('children-container');
    const block = document.createElement('div');
    block.className = 'child-block';
    block.id = 'child-block-' + id;
    block.innerHTML = `
      <div class="child-block-header">
        <strong>Child</strong>
        <button type="button" class="remove-child-link" onclick="removeChildBlock(${id})">Remove</button>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="child-${id}-first-name">First name</label>
          <input type="text" id="child-${id}-first-name" required>
        </div>
        <div class="field">
          <label for="child-${id}-last-name">Last name</label>
          <input type="text" id="child-${id}-last-name" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="child-${id}-dob">Date of birth</label>
          <input type="date" id="child-${id}-dob" required>
        </div>
        <div class="field">
          <label for="child-${id}-program">Program</label>
          <select id="child-${id}-program" required>
            <option value="daycare">Daycare</option>
            <option value="preschool">Preschool</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="child-${id}-allergies">Allergies <span style="font-weight:400; color:#8A9490;">(optional — write "None" if none)</span></label>
        <input type="text" id="child-${id}-allergies">
      </div>
      <div class="field">
        <label for="child-${id}-medical-notes">Medical notes <span style="font-weight:400; color:#8A9490;">(optional)</span></label>
        <input type="text" id="child-${id}-medical-notes">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="child-${id}-emergency-name">Emergency contact</label>
          <input type="text" id="child-${id}-emergency-name" required>
        </div>
        <div class="field">
          <label for="child-${id}-emergency-phone">Emergency phone</label>
          <input type="text" id="child-${id}-emergency-phone" required>
        </div>
      </div>
      <div class="field">
        <label>Services <span style="font-weight:400; color:#8A9490;">(optional)</span></label>
        <div id="child-${id}-services"></div>
        <button type="button" class="clear-link" onclick="addChildServiceRow(${id})">+ Add a service</button>
      </div>
    `;
    container.appendChild(block);
    updateRemoveLinksVisibility();
  }

  function removeChildBlock(id) {
    const block = document.getElementById('child-block-' + id);
    if (block) block.remove();
    updateRemoveLinksVisibility();
  }

  // Hides every "Remove" link when only one child block remains — at least
  // one child is always required, so removing down to zero isn't allowed.
  function updateRemoveLinksVisibility() {
    const blocks = document.querySelectorAll('.child-block');
    blocks.forEach(b => {
      const link = b.querySelector('.remove-child-link');
      if (link) link.style.display = blocks.length > 1 ? 'inline-block' : 'none';
    });
  }

  function collectChildBlocks() {
    const blocks = document.querySelectorAll('.child-block');
    return Array.from(blocks).map(block => {
      const id = block.id.replace('child-block-', '');
      return {
        first_name: document.getElementById(`child-${id}-first-name`).value.trim(),
        last_name: document.getElementById(`child-${id}-last-name`).value.trim(),
        date_of_birth: document.getElementById(`child-${id}-dob`).value,
        program: document.getElementById(`child-${id}-program`).value,
        allergies: document.getElementById(`child-${id}-allergies`).value.trim() || null,
        medical_notes: document.getElementById(`child-${id}-medical-notes`).value.trim() || null,
        emergency_contact_name: document.getElementById(`child-${id}-emergency-name`).value.trim(),
        emergency_contact_phone: document.getElementById(`child-${id}-emergency-phone`).value.trim(),
        services: collectChildServices(id),
      };
    });
  }

  // ============================================================
  // SERVICES — per child, repeatable dropdown ("+ Add a service"), rolled
  // into one running total shown near the card section. Prices shown here
  // are for the parent's reference only; the actual invoice is built
  // server-side from current service_items prices, never trusted from what
  // this page sends.
  // ============================================================
  let servicesCatalog = [];
  let childServiceRowCount = 0;

  async function loadServicesCatalog() {
    try {
      const res = await fetch(API_BASE + '/registrations/services');
      servicesCatalog = await res.json();
    } catch (err) {
      servicesCatalog = []; // registration still works fine with no services offered
    }
  }

  function addChildServiceRow(childId) {
    if (servicesCatalog.length === 0) return; // nothing to offer
    childServiceRowCount++;
    const rowId = childServiceRowCount;
    const wrap = document.getElementById(`child-${childId}-services`);
    const row = document.createElement('div');
    row.className = 'field-row';
    row.id = `child-service-row-${rowId}`;
    row.style.alignItems = 'center';
    row.innerHTML = `
      <div class="field" style="flex:1;">
        <select id="child-service-${rowId}" onchange="recalculateTotal()">
          <option value="">Select a service…</option>
          ${servicesCatalog.map(s => `<option value="${s.id}">${escapeHtml(s.name)} — $${Number(s.default_price).toFixed(2)}</option>`).join('')}
        </select>
      </div>
      <button type="button" class="clear-link" style="margin-bottom:16px;" onclick="removeChildServiceRow(${rowId})">✕</button>
    `;
    wrap.appendChild(row);
  }

  function removeChildServiceRow(rowId) {
    const row = document.getElementById('child-service-row-' + rowId);
    if (row) row.remove();
    recalculateTotal();
  }

  function collectChildServices(childId) {
    const wrap = document.getElementById(`child-${childId}-services`);
    if (!wrap) return [];
    const selects = wrap.querySelectorAll('select');
    return Array.from(selects)
      .filter(sel => sel.value)
      .map(sel => ({ service_item_id: Number(sel.value), quantity: 1 }));
  }

  function recalculateTotal() {
    const allSelects = document.querySelectorAll('.child-block select[id^="child-service-"]');
    let total = 0;
    allSelects.forEach(sel => {
      const service = servicesCatalog.find(s => String(s.id) === sel.value);
      if (service) total += Number(service.default_price);
    });
    const totalWrap = document.getElementById('services-total-wrap');
    if (!totalWrap) return;
    if (total > 0) {
      totalWrap.style.display = 'flex';
      document.getElementById('services-total-amount').textContent = '$' + total.toFixed(2);
    } else {
      totalWrap.style.display = 'none';
    }
  }

  // ============================================================
  // SAVED CARD (Stripe Elements) — same security model as the admin-side
  // card-on-file feature: the card number is typed directly into Stripe's
  // own embedded field and sent straight to Stripe from this page. It NEVER
  // touches this app's JavaScript or backend — only a setup_intent_id (a
  // reference, not card data) comes back, which the backend then verifies
  // actually succeeded before creating anything.
  // ============================================================
  let stripeInstance = null;
  let stripeCardElement = null;
  let savedStripeCustomerId = null;
  let savedSetupIntentId = null;

  async function getStripeInstance() {
    if (stripeInstance) return stripeInstance;
    const res = await fetch(API_BASE + '/config/stripe-key');
    const data = await res.json();
    if (!data.publishable_key) throw new Error('Payment setup is not configured yet.');
    stripeInstance = Stripe(data.publishable_key);
    return stripeInstance;
  }

  async function mountCardElement() {
    const stripe = await getStripeInstance();
    const elements = stripe.elements();
    stripeCardElement = elements.create('card', {
      style: { base: { fontFamily: 'Inter, sans-serif', fontSize: '15px', color: '#3A2E22' } },
    });
    stripeCardElement.mount('#stripe-card-element');
  }

  async function saveCard() {
    const errorBox = document.getElementById('card-error');
    errorBox.classList.remove('visible');

    const parentName = document.getElementById('parent-name').value.trim();
    const parentEmail = document.getElementById('parent-email').value.trim();
    if (!parentName || !parentEmail) {
      errorBox.textContent = 'Enter your name and email above first.';
      errorBox.classList.add('visible');
      return;
    }

    const btn = document.getElementById('save-card-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const stripe = await getStripeInstance();

      const setupRes = await fetch(API_BASE + '/registrations/start-card-setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ primary_parent_name: parentName, primary_parent_email: parentEmail }),
      });
      const setupData = await setupRes.json();
      if (!setupRes.ok) throw new Error(setupData.error || 'Could not start card setup.');

      const result = await stripe.confirmCardSetup(setupData.client_secret, {
        payment_method: { card: stripeCardElement },
      });
      if (result.error) throw new Error(result.error.message);

      savedStripeCustomerId = setupData.stripe_customer_id;
      savedSetupIntentId = result.setupIntent.id;

      document.getElementById('card-status-not-saved').style.display = 'none';
      document.getElementById('card-status-saved').style.display = 'block';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save card';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function initSignaturePad() {
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    ctx.strokeStyle = '#3A2E22';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    signaturePad = { canvas, ctx, drawing: false, hasStroke: false };

    const getPos = (e) => {
      const r = canvas.getBoundingClientRect();
      const point = e.touches ? e.touches[0] : e;
      return { x: point.clientX - r.left, y: point.clientY - r.top };
    };
    const start = (e) => {
      e.preventDefault();
      signaturePad.drawing = true;
      const { x, y } = getPos(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
    };
    const move = (e) => {
      if (!signaturePad.drawing) return;
      e.preventDefault();
      const { x, y } = getPos(e);
      ctx.lineTo(x, y);
      ctx.stroke();
      signaturePad.hasStroke = true;
    };
    const end = () => { signaturePad.drawing = false; };

    canvas.onmousedown = start;
    canvas.onmousemove = move;
    canvas.onmouseup = end;
    canvas.onmouseleave = end;
    canvas.ontouchstart = start;
    canvas.ontouchmove = move;
    canvas.ontouchend = end;
  }

  function clearSignature() {
    if (!signaturePad) return;
    signaturePad.ctx.clearRect(0, 0, signaturePad.canvas.width, signaturePad.canvas.height);
    signaturePad.hasStroke = false;
  }

  async function submitRegistration() {
    const errorBox = document.getElementById('form-error');
    errorBox.classList.remove('visible');

    const form = document.getElementById('register-form');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    if (!savedStripeCustomerId || !savedSetupIntentId) {
      errorBox.textContent = 'Please save a card above before completing enrollment.';
      errorBox.classList.add('visible');
      document.getElementById('stripe-card-element').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (!signaturePad || !signaturePad.hasStroke) {
      errorBox.textContent = 'Please sign in the box above.';
      errorBox.classList.add('visible');
      return;
    }

    const payload = {
      primary_parent_name: document.getElementById('parent-name').value.trim(),
      primary_parent_email: document.getElementById('parent-email').value.trim(),
      primary_parent_phone: document.getElementById('parent-phone').value.trim() || null,
      secondary_parent_name: document.getElementById('secondary-name').value.trim() || null,
      secondary_parent_phone: document.getElementById('secondary-phone').value.trim() || null,
      mailing_address: document.getElementById('mailing-address').value.trim() || null,
      children: collectChildBlocks(),
      signer_name: document.getElementById('signer-name').value.trim(),
      signature_data: signaturePad.canvas.toDataURL('image/png'),
      stripe_customer_id: savedStripeCustomerId,
      setup_intent_id: savedSetupIntentId,
    };

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      const res = await fetch(API_BASE + '/registrations/self-register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');

      renderComplete(data);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Sign & complete enrollment';
    }
  }

  function renderComplete(data) {
    // Static, pre-branded QR code (Little Playhut logo centered in the code
    // itself) hosted on Cloudinary — same image used on the admin-side
    // post-registration screen. Not derived from portalUrl below; if the
    // portal's URL ever changes, this image needs to be regenerated and
    // re-uploaded to match.
    const qrImageUrl = 'https://res.cloudinary.com/dhlymdlu/image/upload/v1788105089/ParentPortal_QR.png';

    document.getElementById('content').innerHTML = `
      <div class="center-state">
        <div class="success-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h2>You're enrolled!</h2>
        <p>${data.registrations.map(r => escapeHtml(r.child_first_name) + ' ' + escapeHtml(r.child_last_name)).join(', ')} ${data.registrations.length > 1 ? 'are' : 'is'} all set at The Little Playhut.</p>

        <div class="credentials-box">
          <img class="qr" src="${qrImageUrl}" width="220" height="220" alt="QR code to the family portal">
          <div class="cred-row"><span class="cred-label">Portal</span><span class="cred-value">portal.html</span></div>
          <div class="cred-row"><span class="cred-label">Email</span><span class="cred-value">${escapeHtml(data.portal_email)}</span></div>
          <div class="cred-row"><span class="cred-label">Password</span><span class="cred-value">${escapeHtml(data.portal_password)}</span></div>
          <div class="save-warning">Save this password now — it won't be shown again. Scan the code or visit the portal link to see daily reports and message the school.</div>
        </div>
      </div>
    `;
  }

  loadServicesCatalog().then(addChildBlock);
  initSignaturePad();
  mountCardElement();
</script>

</body>
</html>
