<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Playhut — Staff Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest-deep: #1B2E22;
    --forest-mid: #3F5A46;
    --sage-light: #E4EBDE;
    --meadow: #CFDCC3;
    --birch: #F4EDE0;
    --wood: #8B5E34;
    --wood-dark: #6E4A28;
    --gold: #D9A441;
    --gold-dark: #BF8A2E;
    --bark: #3A2E22;
    --moss: #6B7A5E;
    --white: #FFFFFF;
    --error: #B3462E;
    --error-bg: #FBEAE4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, var(--sage-light) 0%, var(--meadow) 100%);
    color: var(--bark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* Ambient forest-canopy motif: soft, warm overlapping glows suggesting
     dappled light through leaves. Light and airy, decorative only. */
  .canopy { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .canopy span {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
  }
  .canopy span:nth-child(1) { width: 46vw; height: 46vw; top: -14vw; left: -10vw; }
  .canopy span:nth-child(2) { width: 34vw; height: 34vw; top: -8vw; right: -8vw; background: radial-gradient(circle at 40% 35%, rgba(217,164,65,0.20), rgba(255,255,255,0) 70%); }
  .canopy span:nth-child(3) { width: 52vw; height: 52vw; bottom: -22vw; left: 50%; transform: translateX(-50%); background: radial-gradient(circle at 50% 20%, rgba(63,90,70,0.12), rgba(255,255,255,0) 65%); }
  .canopy span:nth-child(4) { width: 22vw; height: 22vw; bottom: 6vw; left: 4vw; background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.45), rgba(255,255,255,0) 70%); }
  .canopy span:nth-child(5) { width: 18vw; height: 18vw; top: 14vw; right: 12vw; background: radial-gradient(circle at 40% 40%, rgba(217,164,65,0.18), rgba(255,255,255,0) 70%); }

  .login-card {
    position: relative;
    z-index: 1;
    background: var(--birch);
    border: 1px solid rgba(139,94,52,0.18);
    border-radius: 20px;
    padding: 48px 40px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 24px 64px rgba(15, 27, 20, 0.45), 0 2px 8px rgba(15, 27, 20, 0.25);
  }

  .mark {
    width: 128px;
    height: 128px;
    margin: 0 auto 20px;
    display: block;
    object-fit: contain;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 26px;
    text-align: center;
    color: var(--forest-deep);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    text-align: center;
    font-size: 14px;
    color: var(--moss);
    margin: 20px 0 32px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--bark);
    margin-bottom: 6px;
  }

  .field {
    margin-bottom: 18px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid rgba(139,94,52,0.25);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--bark);
    background: #FFFDF8;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    outline: none;
    border-color: var(--gold);
    background: var(--white);
  }

  input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  button[type="submit"] {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: var(--forest-deep);
    color: var(--birch);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button[type="submit"]:hover {
    background: #12241A;
  }

  button[type="submit"]:active {
    transform: scale(0.98);
  }

  button[type="submit"]:disabled {
    background: #B9BFB2;
    cursor: not-allowed;
  }

  button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .error-banner {
    display: none;
    background: var(--error-bg);
    color: var(--error);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
  }

  .error-banner.visible {
    display: block;
  }

  @media (prefers-reduced-motion: reduce) {
    button, input { transition: none; }
  }
</style>
</head>
<body>

  <div class="canopy" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="login-card">
    <img class="mark" src="https://res.cloudinary.com/dhlymdlu/image/upload/v1788058962/Screenshot_2026-08-04_at_8.42.07_PM.png" alt="The Little Playhut — Preschool &amp; Daycare">

    <p class="subtitle">Sign in to the staff dashboard</p>

    <div class="error-banner" id="errorBanner" role="alert"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>

  <script>
    // Update this to the live Render URL if it ever changes.
    const API_BASE = 'https://little-playhut-backend.onrender.com';

    const form = document.getElementById('loginForm');
    const errorBanner = document.getElementById('errorBanner');
    const submitBtn = document.getElementById('submitBtn');

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.add('visible');
    }

    function hideError() {
      errorBanner.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Sign in failed. Check your email and password.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
          return;
        }

        // Store the token and staff info for the dashboard to use.
        // sessionStorage clears when the browser tab closes — reasonable default
        // for a shared shop computer; switch to localStorage if staff want to
        // stay logged in across sessions on a trusted personal device.
        sessionStorage.setItem('lp_token', data.token);
        sessionStorage.setItem('lp_staff', JSON.stringify(data.staff));

        window.location.href = 'dashboard.html';
      } catch (err) {
        console.error(err);
        showError('Could not reach the server. Check your connection and try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>

</body>
</html>
